[package]
name = "nexroute"
version = "0.1.0"
description = "Local proxy gateway with real-delay testing and rotation"
authors = ["WhoisNeon"]
license = "MIT"
repository = "https://github.com/WhoisNeon/NexRoute"
edition = "2021"
rust-version = "1.82"

[lib]
name = "nexroute_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "sync", "process", "fs"] }
rusqlite = { version = "0.37", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "socks", "gzip", "brotli"] }
url = "2"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
percent-encoding = "2"

[profile.release]
strip = true
lto = true
codegen-units = 1
